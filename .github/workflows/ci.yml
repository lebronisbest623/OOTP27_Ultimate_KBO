name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Artifacts
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup MSYS2 MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Restore
        run: dotnet restore .\OOTP27-KBO-Launcher.sln

      - name: Restore WebView2 native package
        shell: pwsh
        run: |
          dotnet new classlib --output .\.ci\webview2-restore --framework net8.0
          dotnet add .\.ci\webview2-restore package Microsoft.Web.WebView2 --version 1.0.3065.39
          dotnet restore .\.ci\webview2-restore

      - name: Generate supported build sources
        shell: pwsh
        run: .\tools\generate-supported-builds.ps1

      - name: Generate runtime flag sources
        shell: pwsh
        run: .\tools\generate-runtime-flags.ps1

      - name: Build native DLL
        shell: pwsh
        run: .\native\build.ps1

      - name: Build optimizer tool
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller ortools
          .\scripts\build-optimizer.ps1 -RebuildOptimizer

      - name: Build managed solution
        run: dotnet build .\OOTP27-KBO-Launcher.sln --configuration Release --no-restore

      - name: Test managed solution
        run: dotnet test .\OOTP27-KBO-Launcher.sln --configuration Release --no-build --verbosity normal

      - name: Verify native architecture
        shell: pwsh
        run: .\tools\check-native-architecture.ps1 -BaselinePath .\tools\native-architecture-baseline.json

      - name: Test native helpers
        shell: pwsh
        run: .\native\tests\run_tests.ps1

      - name: Publish launcher
        run: dotnet publish .\src\KBOLauncher\KBOLauncher.csproj --configuration Release --no-build --output .\artifacts\KBOLauncher

      - name: Collect native artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\native | Out-Null
          Copy-Item .\native\bin\KBOFix.dll .\artifacts\native\KBOFix.dll -Force
          Copy-Item .\native\bin\WebView2Loader.dll .\artifacts\native\WebView2Loader.dll -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KBOLauncher-windows
          path: artifacts

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: KBOLauncher-windows
          path: artifacts

      - name: Package artifacts
        shell: pwsh
        run: Compress-Archive -Path .\artifacts\* -DestinationPath .\KBOLauncher-windows.zip -Force

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: KBOLauncher-windows.zip
